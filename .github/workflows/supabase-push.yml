name: Supabase migrations

# Applies new SQL migrations to the linked Supabase project whenever
# main updates files under supabase/migrations/. PR review is the
# safety net — anything that lands on main runs here.
#
# Required GitHub repo secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN   personal access token from
#                           https://supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF    the project ref (e.g. "abcdwxyz") visible in
#                           the project's Supabase URL or Settings → General
#   SUPABASE_DB_PASSWORD    the database password (Settings → Database →
#                           Connection string). Used by `db push`.
#
# Manual trigger:
#   The workflow_dispatch trigger lets you re-run the migration push
#   from the Actions tab if you ever need to apply files that were
#   merged before this workflow existed.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/supabase-push.yml'
  workflow_dispatch:

# One push at a time. If a second push lands while one is running,
# queue it — we don't want concurrent `db push` runs racing each other.
concurrency:
  group: supabase-push
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    # 5 minutes is plenty for the migrations we have today and gives
    # noisy migrations a hard ceiling.
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # `version: 2.x` was rejected by setup-cli as "Invalid Version"
          # — the action wants either `latest` or an exact semver
          # (no wildcard ranges). Pinning to a recent stable so behaviour
          # is reproducible; bump deliberately when we want a new CLI
          # feature.
          version: 2.30.4

      - name: Link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Push migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        # --include-all because we have some same-timestamp migration
        # pairs in the repo history (20260522130000_*). Without the flag
        # the CLI refuses to push out-of-order. The flag is idempotent —
        # migrations already on remote are no-ops.
        run: supabase db push --include-all
