# Fly.io config for the myHome FastAPI backend.
# Rename `app` to your real Fly app name after `flyctl launch --no-deploy`.

app = "myhome-api"
primary_region = "syd"

[build]

[env]
  ENVIRONMENT = "production"
  LOG_LEVEL = "info"
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 200
    soft_limit = 100

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "get"
    timeout = "5s"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1
